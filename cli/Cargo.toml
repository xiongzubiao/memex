[package]
name = "memex-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "memex"
path = "src/main.rs"

[lib]
name = "memex_cli"
path = "src/lib.rs"

[dependencies]
memex-core = { path = "../core" }
memex-agent = { path = "../agent", features = ["dry-run"] }
zeroclaw = { git = "https://github.com/zeroclaw-labs/zeroclaw.git", tag = "v0.6.8", package = "zeroclawlabs", features = ["rag-pdf"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "5.0"
atty = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
base64 = "0.22"
chacha20poly1305 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.50", features = ["test-util"] }
