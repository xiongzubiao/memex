[package]
name = "memex-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "memex"
path = "src/main.rs"

[dependencies]
memex-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
