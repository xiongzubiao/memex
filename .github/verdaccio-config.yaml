storage: /verdaccio/storage/data
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  # Packages under test: never proxy. The published 0.1.1 lives on
  # public npmjs; if Verdaccio proxied, every PR-time rehearsal would
  # 409 against the already-published upstream version. Bypassing
  # upstream entirely lets the rehearsal publish AND install against
  # a clean local registry, independent of any release state.
  '@xiongzubiao/*':
    access: $all
    publish: $all
  '@*/*':
    access: $all
    publish: $all
    proxy: npmjs
  '**':
    access: $all
    publish: $all
    proxy: npmjs
log: { type: stdout, format: pretty, level: http }
# Default is 10mb; the linux-x64 binary tarball is ~8mb but other platforms may grow.
max_body_size: 200mb
