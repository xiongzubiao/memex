[package]
name = "memex-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
memex-core = { path = "../core" }
zeroclaw = { git = "https://github.com/zeroclaw-labs/zeroclaw.git", tag = "v0.6.8", package = "zeroclawlabs", features = ["rag-pdf"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
tracing = "0.1"
regex = "1.10"

[features]
dry-run = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.50", features = ["test-util"] }
