[package]
name = "memex-core"
version = "0.1.0"
edition = "2024"
description = "Memex knowledge base engine — pure storage and search"
publish = false

[dependencies]
tokio = { version = "1.50", features = ["sync", "fs", "rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
fs2 = "0.4"
walkdir = "2"
thiserror = "2"
regex = "1.10"
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-23"] }

[dev-dependencies]
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
