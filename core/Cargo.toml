[package]
name = "memex-core"
version = "0.1.0"
edition = "2024"
description = "Memex knowledge base engine (LLM-wiki pattern)"
publish = false

[dependencies]
tokio = { version = "1.50", features = ["sync", "fs", "rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
sha2 = "0.10"
fs2 = "0.4"
walkdir = "2"
zip = "2"
flate2 = "1"
tar = "0.4"
thiserror = "2"
regex = "1.10"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
