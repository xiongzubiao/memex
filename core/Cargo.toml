[package]
name = "memex-core"
version = "0.1.0"
edition = "2024"
description = "Memex knowledge base engine — pure storage and search"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
fs2 = "0.4"
walkdir = "2"
thiserror = "2"
regex = "1.10"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-23"] }
toml = "0.8"
rand = "0.8"
dirs = "5.0"

[dev-dependencies]
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
filetime = "0.2"
serial_test = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[test]]
name = "parallel_writes"
required-features = ["test-utils"]

[[test]]
name = "lint_fix_concurrent"
required-features = ["test-utils"]

[[test]]
name = "crash_recovery"
required-features = ["test-utils"]

[features]
test-utils = []
